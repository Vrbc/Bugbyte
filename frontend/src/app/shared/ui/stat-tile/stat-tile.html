<div class="flex flex-col gap-bb-xs rounded-card border border-border bg-level-1 p-bb-sm">
  <div class="flex items-center justify-between">
    @if (icon()) {
      <span class="material-symbols-outlined" [class]="accentClasses()">{{ icon() }}</span>
    }
    @if (live()) {
      <span class="h-2 w-2 rounded-full bg-positive animate-pulse"></span>
    }
  </div>
  <div>
    <p class="font-label-sm text-label-sm uppercase tracking-wider text-on-surface-variant">{{ label() }}</p>
    <p class="font-display text-display-lg-mobile" [class]="accentClasses()">{{ value() }}</p>
  </div>
</div>
