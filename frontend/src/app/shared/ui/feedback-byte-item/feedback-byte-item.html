<div class="relative flex gap-bb-sm pb-bb-sm">
  @if (!isLast()) {
    <div class="absolute bottom-0 left-2.75 top-6 w-0.5 bg-border"></div>
  }
  <div class="relative z-10 mt-1 flex h-6 w-6 shrink-0 items-center justify-center rounded-full border-2 border-border bg-level-1">
    <div class="h-2 w-2 rounded-full" [class]="dotClasses()"></div>
  </div>

  <div class="flex-1 rounded-card border border-border bg-level-1 p-bb-sm">
    <div class="mb-1 flex flex-wrap items-center justify-between gap-bb-xs">
      <span class="font-mono text-label-mono text-cyan">{{ formattedTime() }}</span>
      <div class="flex items-center gap-1">
        @if (byte().severity) {
          <span class="rounded-sm border border-border px-2 py-0.5 font-label-sm text-label-sm text-on-surface-variant">
            {{ byte().severity }}
          </span>
        }
        <app-status-badge [status]="byte().type" />
      </div>
    </div>

    @if (byte().comment) {
      <p class="font-body text-body-md text-on-background">{{ byte().comment }}</p>
    }

    @if (byte().reproductionSteps) {
      <p class="mt-bb-xs rounded-sm border border-border bg-level-0 p-bb-xs font-body text-body-md text-on-surface-variant">
        {{ byte().reproductionSteps }}
      </p>
    }

    @if (byte().screenshotUrl) {
      <a
        [href]="byte().screenshotUrl | resolveUploadUrl"
        target="_blank"
        class="mt-bb-xs inline-flex items-center gap-1 font-body text-body-md text-cyan hover:text-purple"
      >
        <span class="material-symbols-outlined text-base">image</span>
        Open screenshot
      </a>
    }
  </div>
</div>
