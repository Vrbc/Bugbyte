<div class="flex flex-wrap gap-1">
  @for (option of options(); track option) {
    <button
      type="button"
      class="rounded-sm border px-3 py-1.5 font-body text-body-md transition-colors"
      [class]="
        selected().includes(option)
          ? 'border-cyan bg-cyan/10 text-cyan'
          : 'border-border bg-level-1 text-on-surface-variant hover:border-cyan/50'
      "
      (click)="toggleOption.emit(option)"
    >
      {{ option }}
    </button>
  }
</div>
