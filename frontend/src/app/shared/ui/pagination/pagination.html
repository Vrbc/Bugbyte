@if (totalPages() > 1) {
  <div class="mt-bb-md flex items-center justify-center gap-bb-sm">
    <app-button variant="secondary" [disabled]="page() <= 1" (click)="pageChange.emit(page() - 1)">
      <span class="material-symbols-outlined text-base">chevron_left</span>
      Previous
    </app-button>
    <span class="font-mono text-label-mono text-on-surface-variant">Page {{ page() }} of {{ totalPages() }}</span>
    <app-button variant="secondary" [disabled]="page() >= totalPages()" (click)="pageChange.emit(page() + 1)">
      Next
      <span class="material-symbols-outlined text-base">chevron_right</span>
    </app-button>
  </div>
}
